<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Painted valley</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #dfeaf0;
        color: #24323a;
        font: 15px/1.4 Georgia, 'Times New Roman', serif;
        user-select: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #loading,
      #start {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        letter-spacing: 0.06em;
        pointer-events: none;
      }
      #loading {
        background: #dfeaf0;
      }
      #start {
        display: none;
        align-content: end;
        padding-bottom: 9vh;
        color: #fff;
        text-shadow: 0 1px 10px rgba(20, 50, 80, 0.55);
      }
      #start b {
        display: block;
        font-size: 19px;
        font-weight: normal;
      }
      #start span {
        display: block;
        margin-top: 4px;
        font-size: 13px;
        opacity: 0.85;
        text-align: center;
      }
      #note {
        position: fixed;
        top: 7vh;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 19px;
        letter-spacing: 0.06em;
        color: #fff;
        text-shadow: 0 1px 10px rgba(20, 50, 80, 0.55);
        opacity: 0;
        transition: opacity 0.6s;
        pointer-events: none;
      }
      #note.on {
        opacity: 1;
        transition: opacity 0.15s;
      }
      .ready:not(.playing) #start {
        display: grid;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="start">
      <div>
        <b>Click to walk</b>
        <span>W A S D · Shift to run · T for time of day</span>
      </div>
    </div>
    <div id="note"></div>
    <div id="loading">Painted valley</div>
    <script type="module" src="./src/valley/main.js"></script>
  </body>
</html>
